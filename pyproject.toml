[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factory-simulator"
version = "1.1.0"
description = "Self-replicating solar factory simulation — interactive research toolkit"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Bryan C"}
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
keywords = ["simulation", "factory", "manufacturing", "self-replication", "research"]

dependencies = [
    "pyyaml>=6.0,<7.0",
    "numpy>=1.22.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
]

[project.optional-dependencies]
viz = [
    "matplotlib>=3.5.0,<4.0.0",
]
ui = [
    "streamlit>=1.28.0,<2.0.0",
    "plotly>=5.18.0,<6.0.0",
]
validation = [
    "pydantic>=2.0.0,<3.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "mypy>=0.950",
]
all = [
    "factory-simulator[viz,ui,validation,dev]",
]

[project.scripts]
factory-sim = "factory_simulator.sim:main"
factory-builder = "factory_simulator.factory_builder:main"
factory-lab = "factory_simulator.ui.app:main"

[project.urls]
Homepage = "https://github.com/bryancraven/replicator_b"
Issues = "https://github.com/bryancraven/replicator_b/issues"
Documentation = "https://github.com/bryancraven/replicator_b#readme"

[tool.setuptools.packages.find]
where = ["."]
include = ["factory_simulator*"]

[tool.setuptools.package-data]
factory_simulator = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = [
    "-v",
    "-ra",
    "--showlocals",
    "--strict-markers",
    "--cov=factory_simulator",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--disable-warnings",
]
markers = [
    "unit: Unit tests for individual components",
    "integration: Integration tests for end-to-end workflows",
    "slow: Tests that take significant time to run",
    "requires_matplotlib: Tests that require matplotlib",
    "requires_yaml: Tests that require PyYAML",
]

[tool.coverage.run]
source = ["factory_simulator"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
    \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
strict_optional = true
check_untyped_defs = true
show_error_context = true
show_column_numbers = true
show_error_codes = true
pretty = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "pytest.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "matplotlib.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pydantic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "factory_simulator.exceptions"
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",
    "W",
    "F",
    "I",
    "C",
    "B",
    "UP",
]
ignore = [
    "E501",
    "B008",
    "C901",
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["F401", "F811"]
